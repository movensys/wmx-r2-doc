name: Build and Deploy Devel Documentation

on:
  push:
    branches: [devel]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install sphinx pydata-sphinx-theme myst-parser sphinxcontrib-mermaid

      - name: Build Sphinx documentation
        run: sphinx-build doc doc/_build

      - name: Deploy to GitHub Pages (devel subdir)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: doc/_build
          publish_branch: gh-pages
          destination_dir: devel
          keep_files: true
